<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SAGA CITY — Educational initiative dedicated to quality academic guidance, structured learning, and systematic examination facilities." />
    <title>SAGA CITY — Academic Excellence &amp; Examination Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Prevent flash of wrong theme before React boots; default is light mode -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("tb-theme");
          if (saved === "dark") {
            document.documentElement.setAttribute("data-theme", "dark");
          } else {
            document.documentElement.removeAttribute("data-theme");
          }
        } catch (e) {}
      })();
    </script>
    <!-- Google Identity Services for One-Click Google Login -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
